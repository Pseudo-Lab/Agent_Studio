[project]
name = "kiosk-agent"
version = "0.1.0"
description = "Vision-Language-Action Agent for Kiosk Automation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kiosk Agent Team"}
]
keywords = ["ai", "agent", "kiosk", "automation", "vlm", "adb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.8.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "langgraph>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
planning = ["langchain-community>=0.2.0", "tavily-python>=0.3.0"]
tts = ["mlx-audio>=0.1.0"]
stt = ["google-cloud-speech>=2.0.0", "google-auth>=2.0.0"]
dev = ["pytest>=7.0.0", "black>=24.0.0", "ruff>=0.3.0"]
all = ["kiosk-agent[planning,tts,stt,dev]"]

[project.scripts]
kiosk-agent = "api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiosk_agent", "api"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
